# nfpm manifest — .rpm / .deb / arch from the same definition.
# Layout mirrors the AppDir so the binary's exe-relative resource
# resolution (melo-qml, presets, ../share/melo) works unchanged:
# real binary under /usr/lib/melo/bin, symlink in /usr/bin.
name: melo
arch: amd64
platform: linux
version: ${MELO_PKG_VERSION}
maintainer: melo
description: A YouTube integrated native desktop music player.
license: GPL-3.0-or-later
contents:
  - src: ./pkgroot/bin/
    dst: /usr/lib/melo/bin
  - src: ./pkgroot/share/melo/
    dst: /usr/lib/melo/share/melo
  - src: /usr/lib/melo/bin/melo
    dst: /usr/bin/melo
    type: symlink
  - src: ./resources/melo.desktop
    dst: /usr/share/applications/melo.desktop
  - src: ./resources/melo.png
    dst: /usr/share/icons/hicolor/512x512/apps/melo.png
  - src: ./resources/io.github.melo_foundation.melo.metainfo.xml
    dst: /usr/share/metainfo/io.github.melo_foundation.melo.metainfo.xml
  # GPL-3.0 s4/s5: the licence is conveyed with the work. Debian expects it at
  # this path and rpmlint looks for a %license file; one path satisfies both
  # since the packages share this definition.
  - src: ./pkgroot/share/melo/LICENSE
    dst: /usr/share/doc/melo/copyright
  - src: ./pkgroot/share/melo/THIRD-PARTY.md
    dst: /usr/share/doc/melo/THIRD-PARTY.md
  # Node 22 (official build): Debian and Ubuntu ship an older Node than the
  # sidecar needs, and this keeps deb and rpm on the one tested build. Arch
  # depends on its own, which is always newer.
  - src: ./pkgnode/node
    dst: /usr/lib/melo/bin/node
    packager: deb
  - src: ./pkgnode/node
    dst: /usr/lib/melo/bin/node
    packager: rpm
  - src: ./pkgnode/share/
    dst: /usr/lib/melo/share/melo/
    packager: deb
  - src: ./pkgnode/share/
    dst: /usr/lib/melo/share/melo/
    packager: rpm
# shared libraries the binary needs, per distro
  # The package repository, written by the release workflow (pkgrepo/): each
  # release carries the address, so a later move reaches everyone who updates.
  - src: ./pkgrepo/melo.sources
    dst: /etc/apt/sources.list.d/melo.sources
    type: config
    packager: deb
  - src: ./pkgrepo/melo-archive-keyring.pgp
    dst: /usr/share/keyrings/melo-archive-keyring.pgp
    packager: deb
  - src: ./pkgrepo/melo-dnf.repo
    dst: /etc/yum.repos.d/melo.repo
    type: config
    packager: rpm
  - src: ./pkgrepo/melo-zypp.repo
    dst: /etc/zypp/repos.d/melo.repo
    type: config
    packager: rpm
  - src: ./pkgrepo/melo.asc
    dst: /etc/pki/rpm-gpg/RPM-GPG-KEY-melo
    packager: rpm

overrides:
  deb:
    depends:
      - libgstreamer1.0-0
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      # an AAC decoder: faad (bad) or avdec_aac (libav)
      - gstreamer1.0-plugins-bad | gstreamer1.0-libav
      - libxkbcommon0
      - libxkbcommon-x11-0
      - fontconfig
      - libopengl0
      - libglx0
      - libegl1
      - libgbm1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libwayland-server0
      - libxcb-cursor0
      - libxcb-glx0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-sync1
      - libxcb-xfixes0
      - libxcb-xkb1
      - libsm6
      - libice6
  rpm:
    # Libraries by soname, which every rpm distribution's packages provide whatever
    # they are named; GStreamer plugins are listed by Fedora's or openSUSE's package name.
    # From the NEEDED entries of melo, node and ffmpeg.
    depends:
      - (gstreamer1-plugins-base or gstreamer-plugins-base)
      - (gstreamer1-plugins-good or gstreamer-plugins-good)
      - (gstreamer1-plugins-bad-free or gstreamer-plugins-bad)   # fdkaacdec, the AAC decoder
      - ld-linux-x86-64.so.2()(64bit)
      - libc.so.6()(64bit)
      - libdl.so.2()(64bit)
      - libdrm.so.2()(64bit)
      - libEGL.so.1()(64bit)
      - libfontconfig.so.1()(64bit)
      - libfreetype.so.6()(64bit)
      - libgbm.so.1()(64bit)
      - libgcc_s.so.1()(64bit)
      - libgio-2.0.so.0()(64bit)
      - libglib-2.0.so.0()(64bit)
      - libGLX.so.0()(64bit)
      - libgobject-2.0.so.0()(64bit)
      - libgstapp-1.0.so.0()(64bit)
      - libgstreamer-1.0.so.0()(64bit)
      - libICE.so.6()(64bit)
      - libm.so.6()(64bit)
      - libOpenGL.so.0()(64bit)
      - libpthread.so.0()(64bit)
      - libSM.so.6()(64bit)
      - libstdc++.so.6()(64bit)
      - libudev.so.1()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - libwayland-server.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxcb-cursor.so.0()(64bit)
      - libxcb-glx.so.0()(64bit)
      - libxcb-icccm.so.4()(64bit)
      - libxcb-image.so.0()(64bit)
      - libxcb-keysyms.so.1()(64bit)
      - libxcb-randr.so.0()(64bit)
      - libxcb-render.so.0()(64bit)
      - libxcb-render-util.so.0()(64bit)
      - libxcb-shape.so.0()(64bit)
      - libxcb-shm.so.0()(64bit)
      - libxcb.so.1()(64bit)
      - libxcb-sync.so.1()(64bit)
      - libxcb-xfixes.so.0()(64bit)
      - libxcb-xkb.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libz.so.1()(64bit)
  archlinux:
    depends:
      - gstreamer
      - gst-plugins-base
      - gst-plugins-good
      - gst-plugins-bad   # faad, the AAC decoder
      - nodejs>=22.22.2   # the sidecar; jsdom 30's floor
      - libxkbcommon
      - libxkbcommon-x11
      - fontconfig
      - xcb-util-cursor
      - xcb-util-wm
      - xcb-util-image
      - xcb-util-keysyms
      - xcb-util-renderutil
      - libsm
      - libice

# xz: the bundled Node is ~100 MB; gzip would leave the deb/rpm ~15 MB bigger
deb:
  compression: xz
rpm:
  compression: xz
  # signed when the release workflow provides the key; unsigned otherwise
  signature:
    key_file: ${MELO_SIGNING_KEY_FILE}
